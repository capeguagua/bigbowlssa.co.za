<style>
/* V17: streamlined footer with aligned icon set */
.footer .footerinner{width:min(1420px,calc(100% - 54px));display:grid;grid-template-columns:minmax(240px,1fr) minmax(420px,auto);align-items:center;gap:18px 28px}
.footer .footer-contact{display:flex;justify-content:flex-end;align-items:center;gap:14px;min-width:0}
.footer .footer-address{font-size:11px;color:#b3a99b;line-height:1.4;white-space:nowrap}
.footer .footer-icon-links{display:flex;align-items:center;justify-content:center;gap:9px;flex:0 0 auto}
.footer .footer-icon{display:inline-flex;width:34px;height:34px;min-width:34px;align-items:center;justify-content:center;border:1px solid #7a6243;border-radius:50%;color:var(--gold);background:#1b1512;text-decoration:none;transition:background .18s,color .18s,border-color .18s,transform .18s}
.footer .footer-icon:hover{background:var(--gold);color:#17110d;border-color:var(--gold);transform:translateY(-1px)}
.footer .footer-icon svg{display:block;width:17px;height:17px}
.footer .footer-copyright{font-size:11px;line-height:1.45;color:#a89b8c}

@media(max-width:600px){.footer .footerinner{width:calc(100% - 32px)}.footer .footer-contact{gap:8px 12px}.footer .footer-address{font-size:10px}.footer .footer-icon{width:33px;height:33px;min-width:33px}}
